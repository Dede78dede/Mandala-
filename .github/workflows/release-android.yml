name: Release Web + Signed Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (defaults to v + version.json)'
        required: false
        default: ''
      allow_unsigned_preview:
        description: 'Allow unsigned debug-preview APK build without signing secrets'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-and-release:
    name: Build Rust JNI + Signed APK + GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      apk_sha256: ${{ steps.hash.outputs.apk_sha256 }}
      apk_size_bytes: ${{ steps.hash.outputs.apk_size_bytes }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Signing Secrets & Human Help Flag
        env:
          HAS_KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_CERT_SHA: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 != '' }}
          ALLOW_UNSIGNED: ${{ github.event.inputs.allow_unsigned_preview == true }}
        run: |
          MISSING=""
          for pair in \
            "ANDROID_KEYSTORE_BASE64:$HAS_KS_B64" \
            "ANDROID_KEYSTORE_PASSWORD:$HAS_KS_PASS" \
            "ANDROID_KEY_ALIAS:$HAS_KEY_ALIAS" \
            "ANDROID_KEY_PASSWORD:$HAS_KEY_PASS" \
            "ANDROID_SIGNING_CERT_SHA256:$HAS_CERT_SHA"; do
            NAME="${pair%%:*}"
            FLAG="${pair##*:}"
            if [ "$FLAG" != "true" ]; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::[HELP - AZIONE UMANA RICHIESTA] Secrets mancanti nel repository:${MISSING}"
            echo "::notice::Esegui localmente: python3 scripts/setup_android_release.py --repo ${{ github.repository }} --generate-keystore ~/.android/mandala-release.p12 --apply-gh"
            if [ "$ALLOW_UNSIGNED" != "true" ]; then
              echo "::error::[HELP - AZIONE UMANA RICHIESTA] Configura i 5 GitHub Repository Secrets (${MISSING}) oppure esegui manualmente workflow_dispatch con allow_unsigned_preview=true."
              exit 1
            fi
          fi

      - name: Read Version SSOT
        id: meta
        run: |
          python3 - << 'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          data = json.loads(Path("version.json").read_text(encoding="utf-8"))
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          input_tag = os.environ.get("INPUT_TAG", "").strip()
          tag = input_tag or (ref_name if ref_name.startswith("v") else f"v{data['version']}")
          print(f"version_name={data['version']}")
          print(f"version_code={data['versionCode']}")
          print(f"apk_asset_name={data['apkAssetName']}")
          print(f"release_tag={tag}")
          PY
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,wasm32-unknown-unknown

      - name: Build Rust NDK JNI Libraries (android/app/src/main/jniLibs)
        run: |
          cargo install cargo-ndk --locked
          NDK_HOME=$(ls -d "$ANDROID_HOME/ndk/"* | head -n 1)
          ANDROID_NDK_HOME="$NDK_HOME" cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --manifest-path crates/mandala-core/Cargo.toml --release --features android-jni

      - name: Verify Web Gates & Sync Offline WebView Bundle
        run: |
          npm ci
          python3 -m unittest discover -s scripts -p "test_*.py" -v
          npm run lint && npm test && npm run quality:gate && npm run wasm:check
          VITE_PUBLIC_BASE="/" npm run build
          node scripts/sync_android_assets.mjs

      - name: Decode Signing Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble Signed Sideload Release APK
        working-directory: android
        env:
          MANDALA_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          MANDALA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MANDALA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MANDALA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle testSideloadDebugUnitTest assembleSideloadRelease -PversionName=${{ steps.meta.outputs.version_name }} -PversionCode=${{ steps.meta.outputs.version_code }}

      - name: Prepare Final Release APK & Checksums
        id: hash
        run: |
          mkdir -p release-artifacts
          APK_SRC=$(find android/app/build/outputs/apk/sideload/release -name "*.apk" | head -n 1)
          APK_DEST="release-artifacts/${{ steps.meta.outputs.apk_asset_name }}"
          cp "$APK_SRC" "$APK_DEST"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -n 1)
          if [ -n "$APKSIGNER" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            "$APKSIGNER" verify --verbose "$APK_DEST"
          fi
          SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$APK_DEST")
          (cd release-artifacts && sha256sum "${{ steps.meta.outputs.apk_asset_name }}" > checksums.sha256)
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"

      - name: Generate Release Manifest & Asset Links Preview Artifact
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 scripts/release_manifest.py \
            --apk "release-artifacts/${{ steps.meta.outputs.apk_asset_name }}" \
            --tag "${{ steps.meta.outputs.release_tag }}" \
            --repo "${{ github.repository }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-artifacts/${{ steps.meta.outputs.apk_asset_name }}
            release-artifacts/checksums.sha256
            public/releases/update-manifest.json

  deploy-github-pages:
    name: Deploy Synchronized Web/PWA + Manifest to GitHub Pages
    needs: build-android-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Pages Bundle with Synchronized Update Manifest & AssetLinks
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          npm ci
          python3 scripts/release_manifest.py \
            --sha256 "${{ needs.build-android-and-release.outputs.apk_sha256 }}" \
            --apk-size-bytes "${{ needs.build-android-and-release.outputs.apk_size_bytes }}" \
            --tag "${{ needs.build-android-and-release.outputs.release_tag }}" \
            --repo "${{ github.repository }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          VITE_PUBLIC_BASE="/${REPO_NAME}/" npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
